<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love U Bebeh ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #12000a;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .card {
            padding: 35px;
            width: 85%;
            max-width: 400px;

            background: #21000f;
            border: 2px solid #ff4f9a;
            border-radius: 25px;

            box-shadow: 0 0 30px #ff4f9a;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;

            border-radius: 50%;
            border: 4px solid #ff4f9a;

            box-shadow: 0 0 25px #ff4f9a;
        }

        h1 {
            color: #ff6ba9;
            font-size: 35px;

            text-shadow: 0 0 15px #ff4f9a;
        }

        p {
            color: #ffb3d1;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="images/profile.jpg" alt="Foto gue">

        <h1>I Love U Bebeh ❤️</h1>

        <p>For you, always and forever 💕</p>

    </div>

</body>
</html>
